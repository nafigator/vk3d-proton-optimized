name: Build VKD3D-Proton with Clang (x86-64-v4)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (leave empty to auto-generate)'
        required: false
        default: ''
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  VKD3D_VERSION: '3.0.1'
  OPT_FLAGS_LIST: "'-march=x86-64-v4', '-mtune=znver4', '-O3', '-fomit-frame-pointer', '-falign-functions=32', '-falign-loops=32'"
  MESON_COMMON_ARGS: '--buildtype release -Db_lundef=false'

jobs:
  build:
    runs-on: self-hosted
    container:
      image: archlinux/archlinux:multilib-devel
      options: --user root
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ver: ${{ steps.build.outputs.ver }}
      archive_name: ${{ steps.pack.outputs.archive_name }}
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v${VKD3D_VERSION}-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Install dependencies (Clang, MinGW, Meson)
        run: |
          pacman -Syu --needed --noconfirm \
            git meson ninja \
            clang llvm lld mingw-w64-gcc mingw-w64-crt mingw-w64-headers \
            glslang python wine

      - name: Create compiler wrappers
        run: |
          CLANG_REAL=$(which clang)
          CLANGXX_REAL=$(which clang++)

          cat > /usr/local/bin/clang-filtered << EOF
          #!/bin/bash
          args=()
          for arg in "\$@"; do
              case "\$arg" in
                  -Wl,--allow-shlib-undefined|--allow-shlib-undefined) ;;
                  *) args+=("\$arg") ;;
              esac
          done
          exec "${CLANG_REAL}" "\${args[@]}"
          EOF
          chmod +x /usr/local/bin/clang-filtered

          cat > /usr/local/bin/clang++-filtered << EOF
          #!/bin/bash
          args=()
          for arg in "\$@"; do
              case "\$arg" in
                  -Wl,--allow-shlib-undefined|--allow-shlib-undefined) ;;
                  *) args+=("\$arg") ;;
              esac
          done
          exec "${CLANGXX_REAL}" "\${args[@]}"
          EOF
          chmod +x /usr/local/bin/clang++-filtered

          which clang-filtered clang++-filtered

      - name: Clone VKD3D-Proton source
        run: |
          rm -rf vkd3d-proton
          echo "TAG (release): $TAG"
          git clone --depth 1 --branch "${TAG}" \
            https://github.com/HansKristian-Work/vkd3d-proton.git \
            vkd3d-proton
          cd vkd3d-proton
          git submodule update --init --recursive

      - name: Create Clang cross-files
        working-directory: vkd3d-proton
        run: |
          TARGET64="x86_64-w64-windows-gnu"
          TARGET32="i686-w64-windows-gnu"
          
          cat > build-win64-clang.txt <<EOF
          [binaries]
          c = 'clang-filtered'
          cpp = 'clang++-filtered'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          windres = 'llvm-windres'
          c_ld = 'lld'
          cpp_ld = 'lld'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [built-in options]
          c_args = ['--target=${TARGET64}', ${OPT_FLAGS_LIST}]
          cpp_args = ['--target=${TARGET64}', ${OPT_FLAGS_LIST}]
          c_link_args = ['--target=${TARGET64}', '-fuse-ld=lld']
          cpp_link_args = ['--target=${TARGET64}', '-fuse-ld=lld']
          EOF

          cat > build-win32-clang.txt <<EOF
          [binaries]
          c = 'clang-filtered'
          cpp = 'clang++-filtered'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          windres = 'llvm-windres'
          c_ld = 'lld'
          cpp_ld = 'lld'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'windows'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'

          [built-in options]
          c_args = ['--target=${TARGET32}', ${OPT_FLAGS_LIST}]
          cpp_args = ['--target=${TARGET32}', ${OPT_FLAGS_LIST}]
          c_link_args = ['--target=${TARGET32}', '-fuse-ld=lld']
          cpp_link_args = ['--target=${TARGET32}', '-fuse-ld=lld']
          EOF
          
          echo "--- build-win64-clang.txt ---"
          cat build-win64-clang.txt

      - name: Build VKD3D-Proton
        working-directory: vkd3d-proton
        id: build
        run: |
          meson setup build.64-clang --cross-file=build-win64-clang.txt $MESON_COMMON_ARGS
          ninja -C build.64-clang
          
          meson setup build.32-clang --cross-file=build-win32-clang.txt $MESON_COMMON_ARGS
          ninja -C build.32-clang
          
          VERSION_NAME="${TAG#v}"
          mkdir -p "vkd3d-proton-${VERSION_NAME}/x64" "vkd3d-proton-${VERSION_NAME}/x86"
          cp build.64-clang/libs/d3d12/d3d12.dll "vkd3d-proton-${VERSION_NAME}/x64/"
          cp build.64-clang/libs/d3d12core/d3d12core.dll "vkd3d-proton-${VERSION_NAME}/x64/"
          cp build.32-clang/libs/d3d12/d3d12.dll "vkd3d-proton-${VERSION_NAME}/x86/"
          cp build.32-clang/libs/d3d12core/d3d12core.dll "vkd3d-proton-${VERSION_NAME}/x86/"
          
          cp setup_vkd3d_proton.sh "vkd3d-proton-${VERSION_NAME}/"
          
          tar -caf "vkd3d-proton-${VERSION_NAME}.tar.zst" "vkd3d-proton-${VERSION_NAME}"
          echo "Archive created:"
          ls -lh "vkd3d-proton-${VERSION_NAME}.tar.zst"
          echo "ver=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Locate and copy archive
        id: pack
        working-directory: vkd3d-proton
        run: |
          SRC_ARCHIVE=$(ls vkd3d-proton-*.tar.zst | head -1)
          if [ -z "$SRC_ARCHIVE" ]; then
            echo "ERROR: no archive found"
            ls -lh
            exit 1
          fi
          ARCHIVE_NAME=$(basename "$SRC_ARCHIVE")
          cp "$SRC_ARCHIVE" "../${ARCHIVE_NAME}"
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Archive: ${ARCHIVE_NAME}"
          ls -lh "../${ARCHIVE_NAME}"

      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vkd3d-proton-archive
          path: ${{ steps.pack.outputs.archive_name }}
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vkd3d-proton-archive
          path: .

      - name: Create or update release with archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          VER: ${{ needs.build.outputs.ver }}
          ARCHIVE: ${{ needs.build.outputs.archive_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading files"
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "$ARCHIVE"
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VKD3D-Proton ${VER} (${TAG})" \
              --generate-notes \
              --latest \
              "$ARCHIVE"
          fi